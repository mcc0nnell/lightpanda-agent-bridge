name: Python unit tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q lightpanda_mcp.py lightpanda_service.py lightpanda_evidence.py tests/
      - name: Evidence unit tests
        run: python -m unittest discover -s tests -p "test_*unit.py" -v
      # Real-browser integration requires a separately pinned executable.
